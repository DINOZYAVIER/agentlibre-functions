schema = "agentlibre.function/v2"
id = "agentlibre.chat-reasoning"
version = "1.0.0"
agent = { id = "agentlibre.chat-agent", version = "1.0.0" }
model = { id = "agentlibre.gemma4-12b", version = "1.0.0" }
extensions = [
    { id = "agentlibre.builtins", version = "1.0.0-alpha.15" },
    { id = "agentlibre.execution", version = "1.0.0-alpha.15" },
]
working_directory = "."

[presentation.tool_output]
lines = 10
chars = 500

[presentation.tool]
frame = true

[presentation.colors]
rule = "dim"
run = "bold #FF00FF"
run_id = "bold #FFFFFF"
status_success = "bold #7BD88F"
status_failure = "bold #FF0000"
status_pending = "bold #FFFF00"
operation = "bold #00FFFF"
tool = "bold #00FFFF"
ordinal = "dim"
field = "bold #8AA2D8"
muted = "dim"
json_key = "#00FFFF"
json_string = "#7BD88F"
json_number = "#FFFF00"
json_boolean = "#FF00FF"
json_null = "dim"
markdown_heading = "bold #00FFFF"
markdown_code = "dim"
markdown_inline_code = "#FFFF00"
markdown_strong = "bold"
markdown_emphasis = "italic"
markdown_link = "#8AA2D8"
markdown_quote = "dim"
markdown_bullet = "#00FFFF"
markdown_rule = "dim"

[presentation.model_generation]
details = false

[permissions]
files = "read"
commands = ["find", "rg"]

[inference.generation]
max_output_tokens = 2048

[inference.reasoning]
enabled = true
max_tokens = 1024
preserve = false

[inference.load]
context_tokens = 16384
batch_size = 256
ubatch_size = 128
threads = 8
accelerator = "require_gpu"
gpu_layers = 999
flash_attention = true
kv_cache_type_k = "q8_0"
kv_cache_type_v = "q8_0"

[inference.service]
slots = 2
queue_capacity = 8
continuous_batching = true
idle_timeout = "15m"
