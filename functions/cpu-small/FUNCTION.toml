schema = "agentlibre.function/v2"
id = "agentlibre.cpu-small"
version = "1.0.0"
description = "CPU Small: Gemma 4 E4B QAT on CPU, 16K context. Minimum 16 GB RAM."
agent = { id = "agentlibre.chat-agent", version = "1.0.0" }
model = { id = "agentlibre.gemma4-e4b", version = "1.0.0" }
extensions = [
    { id = "agentlibre.files", version = "1.0.0-alpha.19" },
    { id = "agentlibre.forge", version = "1.0.0-alpha.19" },
    { id = "agentlibre.execution", version = "1.0.0-alpha.19" },
]
working_directory = "."

[presentation.tool_output]
lines = 10
chars = 500

[presentation.tool]
frame = true

[presentation.colors]
rule = "dim"
run = "bold #FF00FF"
run_id = "bold #FFFFFF"
status_success = "bold #7BD88F"
status_failure = "bold #FF0000"
status_pending = "bold #FFFF00"
operation = "bold #00FFFF"
tool = "bold #00FFFF"
ordinal = "dim"
field = "bold #8AA2D8"
muted = "dim"
json_key = "#00FFFF"
json_string = "#7BD88F"
json_number = "#FFFF00"
json_boolean = "#FF00FF"
json_null = "dim"
markdown_heading = "bold #00FFFF"
markdown_code = "dim"
markdown_inline_code = "#FFFF00"
markdown_strong = "bold"
markdown_emphasis = "italic"
markdown_link = "#8AA2D8"
markdown_quote = "dim"
markdown_bullet = "#00FFFF"
markdown_rule = "dim"
input_rule = "oklch(0.439 0 0)"
input_background = "oklch(0.269 0 0)"
input_prompt = "bold oklch(0.718 0.202 349.761)"
input_hint = "dim oklch(0.823 0.12 346.018)"
input_text = "oklch(0.936 0.032 17.717)"
input_activity = "oklch(0.823 0.12 346.018)"
input_selected = "bold oklch(0.518 0.253 323.949)"

[presentation.model_generation]
details = false

[permissions]
files = "write"
commands = [
    "bash", "cargo", "cat", "chmod", "cmake", "cp", "curl", "find", "git",
    "head", "ls", "make", "mkdir", "mv", "ninja", "npm", "node", "python3",
    "pwd", "rg", "rustc", "sed", "sh", "sort", "stat", "tail", "touch",
    "uniq", "wc", "xargs", "imv",
]
terminal = true

[inference.generation]
max_output_tokens = 8192

[inference.load]
context_tokens = 16384
batch_size = 512
ubatch_size = 256
accelerator = "cpu"
mmap = true
kv_cache_type_k = "q8_0"
kv_cache_type_v = "q8_0"

[inference.service]
slots = 1
queue_capacity = 8
continuous_batching = true
idle_timeout = "15m"

[limits]
# No aggregate input cap; exact per-request context capacity still applies.
model_output_tokens = 100000
model_calls = 100
tool_calls = 500
tool_result_bytes = 65536
