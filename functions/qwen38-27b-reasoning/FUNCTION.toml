schema = "agentlibre.function/v1"
id = "agentlibre.qwen38-27b-reasoning"
version = "1.0.0"
agent = { id = "agentlibre.chat-agent", version = "1.0.0" }
model = { id = "agentlibre.qwen38-27b", version = "1.0.0" }
extensions = [{ id = "agentlibre.builtins", version = "1.0.0-alpha.15" }]
tools = [
    "agentlibre.builtins:fs_list",
    "agentlibre.builtins:fs_read",
    "agentlibre.builtins:fs_search",
]
working_directory = "."

[inference.generation]
max_output_tokens = 2048

[inference.reasoning]
enabled = true
max_tokens = 1024

[inference.load]
context_tokens = 65536
batch_size = 2048
ubatch_size = 512
threads = 12
threads_batch = 12
accelerator = "require_gpu"
gpu_layers = "all"
mmap = true
flash_attention = true
kv_cache_type_k = "f16"
kv_cache_type_v = "f16"

[inference.service]
slots = 1
queue_capacity = 8
continuous_batching = true
idle_timeout = "15m"
