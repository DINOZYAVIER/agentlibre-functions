schema = "agentlibre.function/v1"
id = "agentlibre.qwen38-27b-reasoning"
version = "1.0.0"
agent = { id = "agentlibre.chat-agent", version = "1.0.0" }
model = { id = "agentlibre.qwen38-27b", version = "1.0.0" }
extensions = [
    { id = "agentlibre.builtins", version = "1.0.0-alpha.15" },
    { id = "agentlibre.execution", version = "1.0.0-alpha.15" },
]
working_directory = "."

[permissions]
files = "read"
commands = ["find", "rg"]

[inference.generation]
max_output_tokens = 49152
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0

[inference.reasoning]
enabled = true
max_tokens = 32768
default = "xhigh"
preserve = true

[inference.load]
context_tokens = 131072
batch_size = 2048
ubatch_size = 512
threads = 12
threads_batch = 12
accelerator = "require_gpu"
gpu_layers = "all"
mmap = true
flash_attention = true
kv_cache_type_k = "f16"
kv_cache_type_v = "f16"

[inference.service]
slots = 1
queue_capacity = 8
continuous_batching = true
idle_timeout = "15m"

[limits]
timeout = "30m"
# No aggregate input cap; exact per-request context capacity still applies.
model_output_tokens = 100000
model_calls = 100
tool_calls = 500
tool_result_bytes = 65536
