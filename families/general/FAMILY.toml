schema = "agentlibre.function-family/v1"
id = "agentlibre.general"
name = "General"
description = "General-purpose coding and chat profiles, from CPU-only to a 24 GB GPU."
default = "cpu-small"

[[profiles]]
id = "cpu-small"
name = "CPU Small"
function = "function:agentlibre.cpu-small@^1.0"
min_ram_gb = 16

[[profiles]]
id = "gpu-small"
name = "GPU Small"
function = "function:agentlibre.gpu-small@^1.0"
min_vram_gb = 12

[[profiles]]
id = "gpu-high"
name = "GPU High"
function = "function:agentlibre.gpu-high@^1.0"
min_vram_gb = 24
